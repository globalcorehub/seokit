<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="seo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#seo-bg)" rx="16"/>
  <!-- Ambient Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="80" y1="60" x2="880" y2="60" />
    <line x1="80" y1="140" x2="880" y2="140" />
    <line x1="80" y1="220" x2="880" y2="220" />
    <line x1="80" y1="300" x2="880" y2="300" />
    <line x1="80" y1="380" x2="880" y2="380" />
    <line x1="80" y1="460" x2="880" y2="460" />
    <line x1="160" y1="60" x2="160" y2="460" />
    <line x1="320" y1="60" x2="320" y2="460" />
    <line x1="480" y1="60" x2="480" y2="460" />
    <line x1="640" y1="60" x2="640" y2="460" />
    <line x1="800" y1="60" x2="800" y2="460" />
  </g>
  <!-- Holographic SERP Growth Curve -->
  <path d="M 120 400 Q 280 380, 400 280 T 680 180 T 840 100" fill="none" stroke="url(#grid-glow)" stroke-width="5" filter="url(#neon-glow)"/>
  <path d="M 120 400 Q 280 380, 400 280 T 680 180 T 840 100 L 840 460 L 120 460 Z" fill="url(#grid-glow)" opacity="0.08"/>
  <!-- Node Radar Badges -->
  <circle cx="400" cy="280" r="7" fill="#10b981" filter="url(#neon-glow)" />
  <circle cx="680" cy="180" r="7" fill="#0284c7" filter="url(#neon-glow)" />
  <circle cx="840" cy="100" r="9" fill="#6366f1" filter="url(#neon-glow)" />
  <!-- Glass HUD Dashboard Cards -->
  <rect x="120" y="90" width="230" height="90" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">GOOGLE SEARCH POSITION</text>
  <text x="140" y="160" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="700">#1 Top 3 SERP</text>
  <rect x="590" y="320" width="250" height="100" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
  <text x="610" y="355" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">KEYWORD CLUSTERS RANKED</text>
  <text x="610" y="395" fill="#10b981" font-family="monospace" font-size="32" font-weight="700">200+ Pillars</text>
</svg>